<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BookHive Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/login.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <div class="brand">
      <div class="logo">📖</div>
      <h1>BookHive</h1>
      <p>Discover · Read · Grow</p>
    </div>

    <div class="illustration">
      <img src="https://cdn-icons-png.flaticon.com/512/6195/6195699.png" alt="reading">
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div class="form-box">
      <h2>Welcome back</h2>
      <span>Login to continue your reading journey</span>

      <form>
        <div class="input-group">
          <input type="email" placeholder="Email">
        </div>

        <div class="input-group">
          <input type="password" placeholder="Password">
        </div>

        <div class="options">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn-login">Login</button>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social">
          <button class="google">Google</button>
          <button class="apple">Apple</button>
        </div>

        <p class="signup">
          Don't have an account? <a href="#">Sign up</a>
        </p>
      </form>
    </div>
  </div>

</div>

</body>
</html>
