<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <div class="sidebar">
    <div class="logo">📚 BookHive</div>

    <div class="menu">
      <p onclick="goHome()">🏠 Home</p>
      <p onclick="goLibrary()">📚 Library</p>
    </div>
  </div>

  <div class="content">

    <input class="search" placeholder="Search books...">

    <h2>Good morning, Alex 👋</h2>

    <h3>Continue Reading</h3>

    <div class="flex">

      <div class="card" onclick="goDetail()">
        <div class="book-img"></div>
        <div class="title">Atomic Habits</div>
        <div class="author">James Clear</div>

        <div class="bar">
          <div class="progress" style="width:65%"></div>
        </div>
      </div>

      <div class="card">
        <div class="book-img"></div>
        <div class="title">1984</div>
        <div class="author">George Orwell</div>

        <div class="bar">
          <div class="progress" style="width:20%"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
